name: Build DecoTV .nro

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Nro
        # devkitpro/devkita64 is the devkitA64-only image (much smaller than the
        # full devkitpro/devkitpro). Mount workspace to /data and run our script.
        run: |
          docker run --rm -v "${{ github.workspace }}":/data devkitpro/devkita64:20251117 bash /data/DecoTV-Switch/scripts/build_switch.sh

      - name: Upload .nro
        uses: actions/upload-artifact@v4
        with:
          name: DecoTV-nro
          path: DecoTV-Switch/DecoTV_v*.nro

      # 附带 .elf（含调试符号）：真机崩溃时大气层 crash report 的偏移可用
      # addr2line 符号化，精确定位崩溃函数（如 2168-0001 instruction abort）
      - name: Upload .elf
        uses: actions/upload-artifact@v4
        with:
          name: DecoTV-elf
          path: DecoTV-Switch/DecoTV.elf
